name: rdp-registry

# Image registry for the VM, in its own compose project on purpose.
#
# Keeping it out of docker-compose.prod.yml means `docker compose down -v` on
# the application -- which the README documents as the way to rebuild from
# scratch -- cannot take the images with it. Recovering the app from a
# teardown is routine; recovering it from a teardown that also deleted every
# image you could roll back to is not.
#
#   docker compose -f docker-compose.registry.yml up -d
#
# Bound to 127.0.0.1 and never exposed. Docker exempts localhost from its
# HTTPS requirement, so this needs no certificate and no insecure-registries
# entry -- on the VM the daemon pulls from its own loopback, and from a laptop
# you reach it through an SSH tunnel, which is also localhost at both ends:
#
#   ssh -N -L 5000:127.0.0.1:5000 user@vm
#   IMAGE_PREFIX=127.0.0.1:5000/ IMAGE_TAG=sha-abc1234 docker compose \
#     -f docker-compose.prod.yml push
#
# Exposing it would mean TLS, authentication and an open port for images that
# embed production secrets. The tunnel costs nothing and avoids all three.
services:
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Required for registry-gc.sh: without it the API refuses manifest
      # deletes and garbage-collect can never reclaim anything.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registrydata:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  registrydata:
