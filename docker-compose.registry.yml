name: rdp-registry

# Image registry for the VM, in its own compose project on purpose: `docker
# compose down -v` on the application is the documented way to rebuild from
# scratch, and a shared project would let that teardown delete every image
# you could roll back to.
#
# Bound to 127.0.0.1 and never exposed. Docker exempts localhost from its
# HTTPS requirement, so this needs no certificate and no insecure-registries
# entry; CI reaches it through an SSH tunnel, which is localhost at both ends.
# Exposing it would mean TLS, authentication and an open port fronting images
# that embed production secrets. See the README, "The image registry".
services:
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Required for registry-gc.sh: without it the API refuses manifest
      # deletes and garbage-collect can never reclaim anything.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registrydata:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  registrydata:
