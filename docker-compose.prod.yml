name: rdp-prod

# Healthchecks call infrastructure/vm/scripts/healthcheck.js, bind-mounted
# read-only at /healthcheck.js. Keeping it in one file beats repeating an inline
# `node -e` one-liner per service, and it can be corrected without rebuilding
# the images.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: cms
      dockerfile: Dockerfile.prod
    image: rdp-cms:local
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
    volumes:
      - media:/app/public/uploads
      # import-export-data hardcodes appRoot()/data/backups (server/utils/fs.js),
      # so without a volume those backups vanish on container recreate. The image
      # pre-creates the path owned by uid 1001, and an empty named volume
      # inherits that ownership.
      - cmsdata:/app/data
      - ./infrastructure/vm/scripts/healthcheck.js:/healthcheck.js:ro
    networks: [platform]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/healthcheck.js", "http://127.0.0.1:1337/_health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  tiler:
    build:
      context: cloud_functions/earth_engine_tiler
    image: rdp-tiler:local
    restart: unless-stopped
    environment:
      PORT: "8080"
      EE_CREDENTIALS_JSON: ${EE_CREDENTIALS_JSON}
    volumes:
      - ./infrastructure/vm/scripts/healthcheck.js:/healthcheck.js:ro
    networks: [platform]
    healthcheck:
      test: ["CMD", "node", "/healthcheck.js", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: client
      dockerfile: Dockerfile.prod
      args:
        # Inlined into the browser bundle by next build, so they must be present
        # at build time -- setting them only at runtime has no effect.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        CMS_INTERNAL_API_URL: ${CMS_INTERNAL_API_URL}
    image: rdp-client:local
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Server-only, read from process.env at runtime.
      TRANSIFEX_TOKEN: ${TRANSIFEX_TOKEN}
      CMS_INTERNAL_API_URL: ${CMS_INTERNAL_API_URL}
      SITE_URL: ${SITE_URL}
      # Inlined at build; repeated here so `docker compose config` documents the
      # value the image was built with. Changing them at runtime does not
      # change the browser bundle.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
    volumes:
      - ./infrastructure/vm/scripts/healthcheck.js:/healthcheck.js:ro
      # next/image resolves a relative url against the Next server's own origin,
      # which does not serve /cms/* -- nginx does. Exposing the uploads under
      # public/ makes them genuinely local, so the optimizer reads them from
      # disk instead of fetching its own 404 page.
      - media:/app/public/cms/uploads:ro
    networks: [platform]
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      # Max status 500: Next redirects / to a locale prefix, so a 3xx still
      # means the container is up.
      test: ["CMD", "node", "/healthcheck.js", "http://127.0.0.1:3000/", "500"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME}
      REDIRECT_SERVER_NAME: ${REDIRECT_SERVER_NAME}
      CANONICAL_HOST: ${CANONICAL_HOST}
      # Without this filter the entrypoint substitutes EVERY defined variable
      # into the templates, including nginx's own $$host and $$request_uri.
      NGINX_ENVSUBST_FILTER: "^(SERVER_NAME|REDIRECT_SERVER_NAME|CANONICAL_HOST)$$"
    volumes:
      - ./infrastructure/vm/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/vm/nginx/templates:/etc/nginx/templates:ro
      - tilecache:/var/cache/nginx/tiles
      - certs:/etc/nginx/certs:ro
      - certbotwww:/var/www/certbot
    networks: [platform]
    depends_on:
      client:
        condition: service_healthy
      cms:
        condition: service_healthy
      tiler:
        condition: service_healthy

volumes:
  pgdata:
  media:
  cmsdata:
  tilecache:
  certs:
  certbotwww:

networks:
  platform:
    driver: bridge
