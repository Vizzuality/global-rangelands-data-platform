[project]
name = "data-processing"
version = "0.1.0"
description = "Geospatial data processing pipelines for the Global Rangelands Data Platform"
requires-python = ">=3.12"
dependencies = [
    "antimeridian>=0.4.7",
    "apng",
    "beautifulsoup4",
    "boto3>=1.43.11",
    "geopandas",
    "jupyter",
    "jupyterlab-code-formatter",
    "lonboard",
    "matplotlib",
    "mercantile",
    "pillow",
    "polars",
    "python-dotenv>=1.2.2",
    "rasterio",
    "requests",
    "rio-cogeo",
    "rio-tiler",
    "rioxarray",
    "ruff",
    "tqdm",
    "xarray",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "D1",   # pydocstyle errors
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # flake8
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "N",    # Naming conventions
    "I",    # isort
]
ignore = [
    "D104",  # Missing docstring in public package
]
