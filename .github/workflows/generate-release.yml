# Cuts a release of the VM stack: test, build, push the images into the
# registry ON THE VM, fast-forward `production_vm`, tag it. It does not deploy.
#
# Dispatch from `staging` with a version like v1.2.0, or leave the version
# empty to build from any ref without releasing.
#
# What the version buys, why the merge is a fast-forward, and how an operator
# deploys the result: infrastructure/vm/README.md, "Generating a release".
name: Generate release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.2.0. Empty = build only, no tag, no merge.'
        required: false
        type: string

concurrency:
  # Not cancel-in-progress: a run that has pushed images but not yet tagged
  # should be allowed to finish.
  group: vm-release
  cancel-in-progress: false

permissions:
  # To push `production_vm` and the tag. A build-only run never uses it.
  contents: write

env:
  # Same default as deploy-release.sh; through the tunnel this is the VM's registry.
  IMAGE_PREFIX: 127.0.0.1:5000/
  # Compose interpolates the WHOLE file before it filters by service, so the
  # nginx volume's ${CERTBOT_WEBROOT:?} has to resolve even though CI only
  # builds cms, client and tiler and never starts nginx. .env.ci carries the
  # CLIENT_ENV_ values and nothing else, so it comes from here. The value is
  # never read -- it only has to be non-empty.
  CERTBOT_WEBROOT: /unused-in-ci

jobs:
  release:
    runs-on: ubuntu-latest
    # Everything this job needs about the VM lives in the `vm` environment,
    # not at repository level, so no other workflow can see it. That matters
    # because main.yml -- the staging deploy to GCP -- serialises the whole
    # secrets context with toJSON(secrets); anything left at repository level
    # is handed to a job whose business is Vizzuality's GCP, not ILRI's host.
    #
    # It is also where a deployment branch policy goes, once staging carries
    # the stack: restricting this environment to `staging` would stop any
    # branch that can be dispatched from obtaining the registry key.
    environment: vm
    steps:
      - uses: actions/checkout@v4
        with:
          # The fast-forward push needs real ancestry, not a shallow clone.
          fetch-depth: 0

      - name: Decide what this run is, and check it can finish
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The Run workflow dropdown defaults to the default branch and offers
          # no way to change that, so a dispatch from it is usually someone who
          # did not pick a branch at all. Nothing should ever be built from it:
          # Push is not gated on release mode, so even a version-less build
          # puts images in the VM's registry under a stamped tag.
          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            echo "::error::dispatched from '${GITHUB_REF_NAME}', the default branch -- choose one. Releases are cut from 'staging'; a build runs from the branch you want built"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo "build only: no branch will move and no tag will be created"
            echo "mode=build" >> "$GITHUB_OUTPUT"
            # registry-gc.sh only collects tags of this exact shape.
            echo "tag=$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A feature branch would fast-forward production_vm just as legitimately, so
          # nothing downstream would notice code that skipped staging.
          if [ "${GITHUB_REF_NAME}" != "staging" ]; then
            echo "::error::dispatched from '${GITHUB_REF_NAME}'; releases are cut from 'staging'"
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

          # Re-using a version would overwrite the images behind a tag someone
          # may still roll back to, while the git tag kept its old commit.
          if [ -n "$(git ls-remote --tags origin "refs/tags/${VERSION}")" ]; then
            echo "::error::tag ${VERSION} already exists"
            exit 1
          fi

          # Does it fast-forward? git answers that from the remote's refs, so
          # a dry run suffices. `production_vm` may not exist yet; creating it is
          # a fast-forward and passes.
          if ! git push --dry-run origin "HEAD:refs/heads/production_vm"; then
            echo "::error::production_vm cannot fast-forward to staging; it has commits staging does not"
            exit 1
          fi

          # Whether the server will *accept* the push is not asked here. A dry
          # run cannot answer it, and reading the protection API only sees
          # classic rules the token has admin to read -- not rulesets. The
          # real push instead runs before anything reaches the VM, so a
          # refusal costs a build and leaves nothing behind.

          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Install client dependencies
        working-directory: client
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Lint
        working-directory: client
        run: pnpm lint

      - name: Test
        working-directory: client
        run: pnpm test

      - name: Output secrets and vars as JSON
        id: env_json
        # null when empty, or jq fails on an empty string.
        run: |
          {
            echo 'secrets<<EOF'
            echo '${{ secrets != null && toJSON(secrets) || null }}'
            echo 'EOF'
            echo 'vars<<EOF'
            echo '${{ vars != null && toJSON(vars) || null }}'
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Collect the client build environment
        id: client_env
        # (TF_)?(VM_)?CLIENT_ENV_<NAME>, same convention as the staging deploy.
        uses: ./.github/actions/generate-env-file-from-json
        with:
          ENVIRONMENT: VM
          APP_ENV_PREFIX: CLIENT_ENV
          secrets_json: ${{ steps.env_json.outputs.secrets }}
          vars_json: ${{ steps.env_json.outputs.vars }}

      - name: Write it where compose reads it
        # Not client/.env.local as the Cloud Run path does: these images build
        # with STRIP_ENV_FILES=1 and take their config as build args.
        run: |
          umask 077
          printf '%s\n' '${{ steps.client_env.outputs.env_file }}' > .env.ci
          echo "collected $(grep -c '^[A-Z]' .env.ci || true) value(s)"

      - name: Every build arg compose needs must be present and non-empty
        # The requirement lives in docker-compose.prod.yml as ${VAR:?...}; this
        # only triggers the interpolation early. --quiet is not cosmetic: plain
        # `config` prints the resolved file, i.e. every secret. See 82aab64.
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci config --quiet

      - name: The Mapbox token must be publishable
        # Not a missing value but a wrong one, so compose cannot catch it.
        run: |
          token=$(grep -E '^NEXT_PUBLIC_MAPBOX_TOKEN=' .env.ci | head -1 | cut -d= -f2-)
          case "$token" in
            sk.*) echo "::error::NEXT_PUBLIC_MAPBOX_TOKEN is a secret (sk.) token; it is inlined into the public bundle and must be a pk. token"
                  exit 1 ;;
          esac

      - name: Build
        env:
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci build cms client tiler

      - name: Image hygiene
        # Before the push: deleting a tag does not recall what was pulled.
        env:
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
        run: bash infrastructure/vm/scripts/checks/verify-image-hygiene.sh

      # Branch, then images, then tag. The branch push is the only step the
      # server can refuse on policy, so it goes before anything touches the
      # VM: a refusal then leaves no images behind, and `production_vm` moving
      # is idempotent, so re-dispatching after fixing the rule just works.
      # The tag goes last because it is the one thing that blocks a retry --
      # step 1 refuses a version that already exists.
      - name: Fast-forward production_vm
        if: steps.plan.outputs.mode == 'release'
        # A merge commit is not the commit the images were built from, so the
        # version would name two trees. The server enforces this: a plain push
        # to refs/heads/production_vm is rejected unless it fast-forwards.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git push origin "HEAD:refs/heads/production_vm"; then
            echo "::error::the server refused the push to production_vm. If the branch is protected, github-actions must be allowed to push it; see \"Protecting production_vm\" in infrastructure/vm/README.md. Nothing was released and nothing reached the VM, so fix the rule and re-dispatch."
            exit 1
          fi

      - name: Open the tunnel to the VM registry
        uses: ./.github/actions/vm-registry-tunnel
        with:
          ssh_key: ${{ secrets.VM_REGISTRY_SSH_KEY }}
          host: ${{ vars.VM_REGISTRY_HOST }}
          user: ${{ vars.VM_REGISTRY_USER }}
          host_key: ${{ vars.VM_SSH_HOST_KEY }}

      - name: Push
        env:
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
        # Only the version tag; registry-gc.sh skips any digest a protected tag
        # shares, so a stamped twin could never be collected anyway.
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci push cms client tiler

      - name: Close the tunnel
        # Not inside the action above: only JavaScript and Docker actions can
        # declare a post step, composite ones cannot. The runner is ephemeral
        # so this is belt and braces, but a tunnel left open past the step
        # that needs it is not something to leave to the VM shutting it down.
        if: always()
        run: pkill -f 'L 5000:127.0.0.1:5000' || true

      - name: Tag the release
        if: steps.plan.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.plan.outputs.tag }}
        # Last, and only once the images it names are in the registry: the tag
        # is the durable record, and step 1 refuses a version that already
        # exists, so creating it early would block the retry. Protection does
        # not cover tags, so nothing can refuse this.
        run: |
          git tag -a "$VERSION" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Summary
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          {
            if [ "$MODE" = "release" ]; then
              echo "### Released \`${TAG}\`"
              echo
              echo "\`production_vm\` fast-forwarded to \`${GITHUB_SHA}\` and tagged \`${TAG}\`."
            else
              echo "### Built \`${TAG}\` — build only"
              echo
              echo "No branch moved and no git tag was created, so deploying this one"
              echo "also needs \`git checkout ${GITHUB_SHA}\` on the box."
            fi
            echo
            echo "Images are in the registry on the VM. **Nothing is deployed yet.**"
            echo "To deploy: \`infrastructure/vm/RUNBOOK.md\` section 2."
          } >> "$GITHUB_STEP_SUMMARY"
