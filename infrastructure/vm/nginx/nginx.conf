user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format cached '$remote_addr - $status "$request" '
                      'cache=$upstream_cache_status bytes=$body_bytes_sent';
    access_log /var/log/nginx/access.log cached;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # The 1M default silently 413s Strapi media uploads.
    client_max_body_size 200M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Replaces Cloud CDN. 30g against 145 GB free on the VM.
    proxy_cache_path /var/cache/nginx/tiles
                     levels=1:2
                     keys_zone=tiles:100m
                     max_size=30g
                     inactive=1w
                     use_temp_path=off;

    # Named explicitly, not globbed. The base image ships its own
    # conf.d/default.conf claiming server_name localhost, which sorts first and
    # would win the exact-name match, serving the nginx welcome page instead of
    # the platform.
    include /etc/nginx/conf.d/platform.conf;
}
